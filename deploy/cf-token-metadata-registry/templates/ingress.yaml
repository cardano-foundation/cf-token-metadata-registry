{{- if .Values.ingress.enabled -}}
{{- $fullName := include "cf-token-metadata-registry.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "cf-token-metadata-registry.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  rules:
    - host: "api.{{ .Values.domain }}"
      http:
        paths:
        - path: /health
          pathType: Prefix
          backend:
            service:
              name: {{ $fullName }}
              port:
                number: {{ $svcPort }}
        - path: /metadata
          pathType: Prefix
          backend:
            service:
              name: {{ $fullName }}
              port:
                number: {{ $svcPort }}
        - path: /api/v2
          pathType: Prefix
          backend:
            service:
              name: {{ $fullName }}
              port:
                number: {{ $svcPort }}
        - path: /apidocs
          pathType: Prefix
          backend:
            service:
              name: {{ $fullName }}
              port:
                number: {{ $svcPort }}
    {{- range $domain := .Values.ingress.additionalDomains }}
    - host: {{ $domain }}
      http:
        paths:
        - path: /health
          pathType: Prefix
          backend:
            service:
              name: {{ $fullName }}
              port:
                number: {{ $svcPort }}
        - path: /metadata
          pathType: Prefix
          backend:
            service:
              name: {{ $fullName }}
              port:
                number: {{ $svcPort }}
        - path: /api/v2
          pathType: Prefix
          backend:
            service:
              name: {{ $fullName }}
              port:
                number: {{ $svcPort }}
        - path: /apidocs
          pathType: Prefix
          backend:
            service:
              name: {{ $fullName }}
              port:
                number: {{ $svcPort }}
    {{- end }}
  tls:
    - hosts:
        - "api.{{ .Values.domain }}"
{{ with .Values.ingress.additionalDomains }}
        {{- toYaml . | nindent 8 }}
{{ end }}
{{ end }}
