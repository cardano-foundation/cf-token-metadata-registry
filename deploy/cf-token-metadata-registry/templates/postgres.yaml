{{ if .Values.postgres.createDb }}
apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  # name must start w/ teamId
  name: {{ include "cf-token-metadata-registry.postgres.clusterName" . }}
spec:
  teamId: "cf"
  volume:
    size: 50Gi
  numberOfInstances: {{ .Values.postgres.numberOfInstances | default 2 }}
  users:
    {{ include "cf-token-metadata-registry.postgres.user" . }}: []
  databases:
    {{ include "cf-token-metadata-registry.postgres.dbName" . }}: {{ include "cf-token-metadata-registry.postgres.user" . }}
  postgresql:
    version: "15"
  enableLogicalBackup: true
{{ end }}
