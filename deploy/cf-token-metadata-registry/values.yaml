rwReplicaCount: 1
roReplicaCount: 2

roStrategy: {}

# Keep read-only replicas on separate nodes.
roAffinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: read-only
        topologyKey: kubernetes.io/hostname

api:
  image:
    repository: cardanofoundation/cf-token-metadata-registry-api
    tag: "0.0.1"
    pullPolicy: Always
  tokenMetadataUpdateJob:
    enabled: true
  # CIP-113 registry-node NFT policy IDs, a list; passed to the API joined with commas (CIP113_REGISTRY_NFT_POLICY_IDS).
  # An empty list keeps CIP-113 off. The official deployments: mainnet 484e733d122af44e6101988bcc47ed261a7af5c43c797e89d60e3075,
  # preprod 3083d387537f9318b6ff5aeab7de5f5629d26495319b8fafd409222a (the shipped .env files of 2.0.0).
  cip113RegistryNftPolicyIds: []
  startupProbe:
    httpGet:
      path: /actuator/health/startup
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

job:
  enabled: false
  image:
    repository: cardanofoundation/cf-token-metadata-registry-job
    tag: "0.0.1"
    pullPolicy: Always
  cron: "15 * * * *"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  disableActuatorEndpoint: true
  additionalDomains: []

postgres:
  createDb: true
  numberOfInstances: 2
  host: cf-token-metadata-registry-pg
  port: 5432
  dbName: cf_token_metadata_registry
  schema: public
  secret:
    name: cardano.cf-token-metadata-registry-pg.credentials.postgresql.acid.zalan.do
    userKey: username
    hostKey: password


resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

monitoring:
  enabled: true

cardano:
  node:
    host: backbone.cardano.iog.io
    port: 3001
    protocolMagic: "764824073"
    syncStartSlot:
    syncStartBlockhash:
    blocksEpochCalculationInterval:

github:
  organization: "cardano-foundation"
  projectName: "cardano-token-registry"
  mappingsFolder: "mappings"
  tmpFolder: "/tmp"
