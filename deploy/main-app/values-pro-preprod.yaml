stage: pro

network: preprod

domain: pro.cf-token-registry-preprod.eu-central-1.pro.cf-token-metadata-registry.cf-deployments.org

cf-token-metadata-registry:
  enabled: true
  values:
    rwReplicaCount: 1 # rw 0 or 1
    roReplicaCount: 2
    roStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    dbSchema: registry_blue
    api:
      image:
        tag: "2.0.0"
      tokenMetadataUpdateJob:
        enabled: false
      cip113RegistryNftPolicyIds:
        - 3083d387537f9318b6ff5aeab7de5f5629d26495319b8fafd409222a
    job:
      enabled: true
      image:
        tag: "2.0.0"

    postgres:
      numberOfInstances: 2
    ingress:
      additionalDomains:
        - preprod.tokens.cardano.org
    cardano:
      node:
        host: preprod-node.play.dev.cardano.org
        port: 3001
        protocolMagic: "1"
        syncStartSlot: "0"
        syncStartBlockhash: ""
        blocksEpochCalculationInterval: "14400"
    github:
      organization: "cardano-foundation"
      projectName: "metadata-registry-testnet"
      mappingsFolder: "registry"
      tmpFolder: "/tmp"
      forceClone: "false"

cf-eks-monitoring:
  enabled: true
  git:
    targetRevision: "70178e2"
  alloy:
    enabled: true

prometheusStack:
  enabled: false
