name: Docker Build

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: false
        default: 'api'
        description: 'Application to build: api or job'
      variant:
        type: string
        required: true
        description: 'Build variant: jvm or native'
      push:
        type: boolean
        default: false
        description: 'Push image to the registries resolved by cf-gha-baseline'
      version:
        type: string
        required: false
        default: ''
        description: 'Version override (defaults to version.txt)'
    outputs:
      image-tag:
        description: 'Primary Docker image tag that was built'
        value: ${{ jobs.build.outputs.image-tag }}
    secrets:
      DOCKER_REGISTRIES:
        required: false
      HUB_DOCKER_COM_USER:
        required: false
      HUB_DOCKER_COM_PASS:
        required: false
      GITLAB_DOCKER_REGISTRY_URL:
        required: false
      GITLAB_PKG_REGISTRY_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: ⛮ cf-gha-baseline
        uses: cardano-foundation/cf-gha-workflows/./actions/cf-gha-baseline@feat/earthbuild
        id: cf-gha-baseline
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_DOCKER_REGISTRY_URL: ${{ secrets.GITLAB_DOCKER_REGISTRY_URL }}
          PRIVATE_DOCKER_REGISTRY_USER: Deploy-Token
          PRIVATE_DOCKER_REGISTRY_PASS: ${{ secrets.GITLAB_PKG_REGISTRY_TOKEN }}
          HUB_DOCKER_COM_USER: ${{ secrets.HUB_DOCKER_COM_USER }}
          HUB_DOCKER_COM_PASS: ${{ secrets.HUB_DOCKER_COM_PASS }}
          DOCKER_REGISTRIES: "${{ secrets.DOCKER_REGISTRIES }}"

      # image names come from the Earthfile targets; only the local tag needed
      # by the nightly workflow's integration tests is derived here
      - name: Set image metadata
        id: meta
        env:
          INPUT_APP: ${{ inputs.app }}
          INPUT_VARIANT: ${{ inputs.variant }}
        run: |
          if [ "${INPUT_VARIANT}" = "native" ]; then
            IMAGE="cf-token-metadata-registry-${INPUT_APP}-native"
          else
            IMAGE="cf-token-metadata-registry-${INPUT_APP}"
          fi
          echo "image-tag=${IMAGE}:latest" | tee -a "$GITHUB_OUTPUT"

      - name: Download JAR artifact
        if: inputs.variant == 'jvm'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app }}-jar
          path: ${{ inputs.app }}/target

      # earthly builds the matching Earthfile target and functions+DOCKER_TAG_N_PUSH
      # does the tagging/pushing. cf-gha-baseline decided both inputs:
      #   DOCKER_REGISTRIES_FILTERED      - public registries (hub.docker.com, ghcr.io,
      #                                       docker.io) survive release-tag pushes only,
      #                                       so PR and branch builds stay on private
      #                                       registries
      #   EARTHLY_DOCKER_IMAGES_EXTRA_TAGS - PR<N>, branch and tag specific tags
      - name: 🌍 earthly (docker build and push)
        env:
          INPUT_APP: ${{ inputs.app }}
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_PUSH: ${{ inputs.push }}
        run: |
          if [ "${INPUT_PUSH}" = "true" ] && [ -z "${DOCKER_REGISTRIES_FILTERED// /}" ]; then
            echo "[!] PUSH requested but cf-gha-baseline resolved no registry, nothing would be published."
            echo "    Set the DOCKER_REGISTRIES repo secret: space separated registries,"
            echo "    e.g. 'hub.docker.com <gitlab docker registry url>'."
            echo "    Public registries are dropped for PR and branch builds, so a private one is needed for dev builds."
            exit 1
          fi

          EXTRA_TAGS="${EARTHLY_DOCKER_IMAGES_EXTRA_TAGS}"

          # release tags define hub's latest, branch builds do not (cf-gha-baseline only
          # appends 'latest' for main/master branch pushes, which no longer reach public
          # registries)
          if [ "${TRIGGERING_REF}" = "tag" ]; then
            EXTRA_TAGS="${EXTRA_TAGS} latest"
          fi

          earthly +"${INPUT_APP}-${INPUT_VARIANT}" \
            --PUSH="${INPUT_PUSH}" \
            --DOCKER_REGISTRIES="${DOCKER_REGISTRIES_FILTERED}" \
            --DOCKER_IMAGES_EXTRA_TAGS="${EXTRA_TAGS}"

      - name: Save Docker image as artifact
        if: ${{ !inputs.push }}
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image-tag }}
        run: docker save "$IMAGE_TAG" -o /tmp/docker-image.tar

      - name: Upload Docker image artifact
        if: ${{ !inputs.push }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ inputs.app }}-${{ inputs.variant }}
          path: /tmp/docker-image.tar
          retention-days: 1
