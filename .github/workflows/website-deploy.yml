name: Deploy Website to GitHub Pages

# The project's GitHub Pages site: the website (website/) at the root and the interactive API reference at
# /api-reference/ (website/public/api-reference). One workflow deploys both, since a repository has one Pages site.
on:
  push:
    # The live site tracks main: a promotion that touches the site redeploys it.
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "./website/package-lock.json"

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        env:
          # The registry the validator page calls; it must allow https://cardano-foundation.github.io (CORS).
          # The repository variable REGISTRY_API_URL overrides the production registry.
          PUBLIC_REGISTRY_API_URL: ${{ vars.REGISTRY_API_URL || 'https://tokens.cardano.org' }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

      - id: deployment
        uses: actions/deploy-pages@v4
