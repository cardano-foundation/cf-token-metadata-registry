name: Deploy Website to GitHub Pages

# The project's GitHub Pages site: the website at the root and generated API reference under /api/.
# Scalar opens as a request client within each operation page.
on:
  push:
    # The live site tracks main: a promotion that touches the site redeploys it.
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "./website/package-lock.json"

      - name: Install dependencies
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Build website
        working-directory: website
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

      - id: deployment
        uses: actions/deploy-pages@v4
