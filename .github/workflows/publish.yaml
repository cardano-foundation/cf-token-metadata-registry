name: Build and Publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

jobs:
  java-build:
    uses: ./.github/workflows/build.yaml

  docker-api-jvm:
    needs: java-build
    # dev builds on PRs: skip fork PRs (repo secrets are not available there) and release-please's own PRs
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.event.pull_request.head.ref, 'release-please--branches--'))
    uses: ./.github/workflows/docker-build.yaml
    with:
      app: api
      variant: jvm
      push: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-api-native:
    needs: java-build
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.event.pull_request.head.ref, 'release-please--branches--'))
    uses: ./.github/workflows/docker-build.yaml
    with:
      app: api
      variant: native
      push: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-job:
    needs: java-build
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.event.pull_request.head.ref, 'release-please--branches--'))
    uses: ./.github/workflows/docker-build.yaml
    with:
      app: job
      variant: jvm
      push: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
