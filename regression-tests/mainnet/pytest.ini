[pytest]
testpaths = .
markers =
    cip26: CIP-26 off-chain token metadata tests
    cip68: CIP-68 on-chain token metadata tests
    cip113: CIP-113 programmable token tests
    rft: CIP-68 rich fungible token (label 444) tests
    validation: validation_errors and ?validation= tests (ADR-019)
    v1: V1 API endpoint tests
    v2: V2 API endpoint tests
    batch: Batch query tests
    sanity: Sanity / smoke tests
    deletion: Tests asserting upstream registry deletions are propagated (issue #97)
